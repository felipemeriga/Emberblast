[project]
name = "Emberblast"
version = "0.0.2"
description = "Medieval Turn based RPG"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Felipe Meriga", email = "felipe.meriga@gmail.com"}]
requires-python = ">=3.10"
dependencies = [
    "InquirerPy>=0.2.0",
    "PyYAML>=5.4.1",
    "Cerberus>=1.3.4",
    "numpy>=1.21.1",
    "sqlparse>=0.4.1",
    "cloudpickle>=1.6.0",
    "rich>=13.0.0",
    "openai>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/felipemeriga/Emberblast"
"Bug Tracker" = "https://github.com/felipemeriga/Emberblast/issues"

[project.scripts]
emberblast = "emberblast.__main__:run_project"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
